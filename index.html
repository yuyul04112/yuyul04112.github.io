<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="에코랜드 테마파크의 몰입형 호러 체험 — 좀비트레인. 기차를 타고 좀비를 피해 탈출하라!">
<meta property="og:title" content="좀비트레인 — 에코랜드 테마파크">
<meta property="og:description" content="에코랜드 테마파크에서 펼쳐지는 좀비 탈출 체험. 선택이 당신의 운명을 결정합니다.">
<meta property="og:type" content="website">
<title>좀비트레인 — 에코랜드 테마파크</title>

<!-- Google Fonts: Horror -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nosifer&family=Creepster&family=Nanum+Gothic+Coding&display=swap" rel="stylesheet">

<style>
/* ============================================================
   RESET & BASE
   ============================================================ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-deep: #050505;
  --bg-dark: #0a0a0a;
  --text-primary: #c4c4c4;
  --text-dim: #6b6b6b;
  --accent-blood: #8b0000;
  --accent-blood-bright: #b30000;
  --accent-glow: #4a0000;
  --overlay-bg: rgba(0, 0, 0, 0.85);
  --font-horror: 'Nosifer', cursive;
  --font-display: 'Creepster', cursive;
  --font-body: 'Nanum Gothic Coding', monospace;
  --transition-speed: 0.8s;
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--bg-deep);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.8;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}

/* ============================================================
   BACKGROUND IMAGE FRAME SYSTEM
   ============================================================ */
.bg-image-frame {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
  background-size: cover; background-position: center;
  opacity: 0; transition: opacity var(--transition-speed) ease-in-out;
  filter: brightness(0.25) grayscale(40%) blur(1px);
}
.bg-image-frame.active { opacity: 1; }
.bg-image-frame::after {
  content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.8) 100%);
}

/* Dark vignette overlay */
.vignette {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
  pointer-events: none;
  box-shadow: inset 0 0 150px 60px rgba(0,0,0,0.9);
}

/* Scanline effect */
.scanlines {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;
  pointer-events: none; opacity: 0.08;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.3) 2px,
    rgba(0,0,0,0.3) 4px
  );
}

/* Film grain overlay */
.film-grain {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 3;
  pointer-events: none; opacity: 0.04;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
  background-size: 128px 128px;
  animation: grainShift 0.5s steps(3) infinite;
}
@keyframes grainShift {
  0%, 100% { transform: translate(0, 0); }
  33% { transform: translate(-1px, 1px); }
  66% { transform: translate(1px, -1px); }
}

/* ============================================================
   MAIN CONTAINER
   ============================================================ */
.main-container {
  position: relative; z-index: 10;
  display: flex; flex-direction: column;
  width: 100%; height: 100%;
  max-width: 480px; margin: 0 auto;
  padding: 20px 24px;
}

/* ============================================================
   HEADER
   ============================================================ */
.header {
  text-align: center; padding: 18px 0 6px;
  flex-shrink: 0;
  border-bottom: 1px solid rgba(139,0,0,0.15);
  margin-bottom: 4px;
}
.header__title {
  font-family: var(--font-horror);
  font-size: clamp(1.1rem, 3.5vw, 1.4rem);
  color: #990000;
  text-shadow: 0 0 15px rgba(139,0,0,0.6), 0 0 40px rgba(139,0,0,0.3);
  letter-spacing: 3px;
  animation: flicker 5s infinite;
}
.header__subtitle {
  font-family: var(--font-display);
  font-size: 0.75rem;
  color: #555;
  letter-spacing: 4px;
  margin-top: 2px;
}

/* ============================================================
   SCENE AREA
   ============================================================ */
.scene-area {
  flex: 1; display: flex; flex-direction: column; justify-content: center;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 8px 0;
}
.scene-area::-webkit-scrollbar { width: 3px; }
.scene-area::-webkit-scrollbar-thumb { background: var(--accent-blood); border-radius: 3px; }

.scene-text {
  font-size: 1rem; line-height: 2;
  color: #d4d4d4;
  text-shadow: 0 0 12px rgba(139,0,0,0.4), 0 0 2px rgba(200,200,200,0.3);
  min-height: 120px;
  opacity: 1; transition: opacity 0.4s ease;
  letter-spacing: 0.02em;
}
.scene-text.fading { opacity: 0; }

/* Text highlight colors */
.hl-soldier { color: #5b8c5a; text-shadow: 0 0 6px rgba(91,140,90,0.4); }
.hl-zombie { color: #c0392b; text-shadow: 0 0 8px rgba(192,57,43,0.5); font-weight: bold; }
.hl-escape { color: #f1c40f; text-shadow: 0 0 8px rgba(241,196,15,0.4); }
.hl-forest { color: #27ae60; text-shadow: 0 0 6px rgba(39,174,96,0.3); }
.hl-train { color: #e67e22; text-shadow: 0 0 6px rgba(230,126,34,0.3); }
.hl-rescue { color: #3498db; text-shadow: 0 0 8px rgba(52,152,219,0.4); }
.hl-safe { color: #2ecc71; text-shadow: 0 0 8px rgba(46,204,113,0.4); }
.hl-danger { color: #e74c3c; text-shadow: 0 0 8px rgba(231,76,60,0.5); animation: flicker 2s infinite; }
.hl-death { color: #8b0000; text-shadow: 0 0 10px rgba(139,0,0,0.6); font-weight: bold; }
.hl-brand { color: #ff6b35; text-shadow: 0 0 10px rgba(255,107,53,0.5); }

.scene-text .cursor {
  display: inline-block; width: 8px; height: 18px;
  background: var(--accent-blood-bright);
  animation: blink 0.8s step-end infinite;
  vertical-align: middle; margin-left: 2px;
}

/* ============================================================
   CHOICES
   ============================================================ */
.choices-area {
  flex-shrink: 0; padding: 16px 0 8px;
  display: flex; flex-direction: column; gap: 10px;
}
.choice-btn {
  display: block; width: 100%;
  padding: 14px 18px;
  background: rgba(15, 0, 0, 0.75);
  border: 1px solid rgba(139, 0, 0, 0.35);
  color: #b8b8b8;
  font-family: var(--font-body);
  font-size: 0.95rem;
  text-align: left;
  cursor: pointer;
  border-radius: 3px;
  transition: all 0.3s ease;
  position: relative; overflow: hidden;
  letter-spacing: 0.03em;
}
.choice-btn::before {
  content: '▸'; margin-right: 10px;
  color: var(--accent-blood);
  font-size: 0.7rem;
  transition: all 0.3s ease;
}
.choice-btn::after {
  content: '';
  position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(139,0,0,0.08), transparent);
  transition: left 0.5s ease;
}
.choice-btn:hover, .choice-btn:active {
  background: rgba(139, 0, 0, 0.25);
  border-color: var(--accent-blood-bright);
  color: #fff;
  text-shadow: 0 0 10px rgba(255,0,0,0.5);
  transform: translateX(6px);
  box-shadow: 0 0 20px rgba(139,0,0,0.2), inset 0 0 20px rgba(139,0,0,0.1);
}
.choice-btn:hover::before { color: #ff3333; }
.choice-btn:hover::after { left: 100%; }
.choice-btn:disabled {
  opacity: 0.4; pointer-events: none;
}

/* ============================================================
   GAME OVER OVERLAY
   ============================================================ */
.gameover-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100;
  background: rgba(0, 0, 0, 0);
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
  transition: background 0.6s ease;
}
.gameover-overlay.active {
  background: rgba(0, 0, 0, 0.92);
  pointer-events: all;
}
.gameover-panel {
  background: rgba(5, 0, 0, 0.97);
  border: 2px solid var(--accent-blood);
  border-radius: 6px;
  padding: 36px 24px;
  text-align: center;
  max-width: 360px; width: 90%;
  opacity: 0; transform: scale(0.85);
  transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  box-shadow: 0 0 80px rgba(139,0,0,0.5), 0 0 150px rgba(139,0,0,0.2), inset 0 0 40px rgba(139,0,0,0.08);
}
.gameover-overlay.active .gameover-panel {
  opacity: 1; transform: scale(1);
}
.gameover-panel__title {
  font-family: var(--font-horror);
  font-size: 2.2rem;
  color: #cc0000;
  text-shadow: 0 0 30px rgba(200,0,0,0.8), 0 0 60px rgba(139,0,0,0.5);
  margin-bottom: 16px;
  animation: flicker 1.5s infinite;
  letter-spacing: 8px;
}
.gameover-panel__msg {
  font-size: 0.9rem; color: #999;
  margin-bottom: 20px; line-height: 1.7;
}
.gameover-panel__zombie-name {
  font-family: var(--font-display);
  font-size: 1.2rem;
  color: #ff3333;
  text-shadow: 0 0 15px rgba(255,0,0,0.7), 0 0 40px rgba(139,0,0,0.5);
  margin-bottom: 24px;
  padding: 10px 20px;
  border: 1px dashed rgba(200,0,0,0.5);
  border-radius: 4px;
  display: inline-block;
  letter-spacing: 2px;
  animation: flicker 2.5s infinite;
  background: rgba(139,0,0,0.1);
}
.gameover-panel__share-title {
  font-family: var(--font-display);
  font-size: 1rem; color: var(--text-primary);
  margin-bottom: 16px;
  letter-spacing: 1px;
}
.share-buttons {
  display: flex; flex-direction: column; gap: 10px;
}
.share-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 12px;
  border: none; border-radius: 6px;
  font-family: var(--font-body); font-size: 0.9rem;
  font-weight: bold; cursor: pointer;
  transition: all 0.2s ease;
  color: #fff;
}
.share-btn:active { transform: scale(0.97); }
.share-btn--kakao { background: #FEE500; color: #191919; }
.share-btn--facebook { background: #1877F2; }
.share-btn--instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
.share-btn--native { background: rgba(139,0,0,0.5); border: 1px solid var(--accent-blood); }
.share-btn--retry {
  background: var(--accent-blood); margin-top: 8px;
  animation: pulse 2s infinite;
}

/* ============================================================
   START SCREEN
   ============================================================ */
.start-screen {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 200;
  background: radial-gradient(ellipse at center, #0a0000 0%, #020000 70%, #000 100%);
  display: flex; align-items: center; justify-content: center;
  transition: opacity 0.8s ease, visibility 0.8s ease;
}
.start-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.start-screen__content {
  text-align: center; padding: 24px;
  position: relative;
}
.start-screen__logo {
  font-family: var(--font-horror);
  font-size: clamp(2.2rem, 8vw, 3.2rem);
  color: #990000;
  text-shadow: 0 0 30px rgba(139,0,0,0.8), 0 0 80px rgba(139,0,0,0.5), 0 0 120px rgba(139,0,0,0.3);
  animation: flicker 2.5s infinite;
  line-height: 1.2; margin-bottom: 20px;
  letter-spacing: 4px;
}
.start-screen__tagline {
  font-family: var(--font-display);
  font-size: 1rem; color: #777;
  letter-spacing: 5px; margin-bottom: 48px;
}
.start-btn {
  display: inline-block;
  padding: 18px 56px;
  background: transparent;
  border: 2px solid #990000;
  color: #cc0000;
  font-family: var(--font-display);
  font-size: 1.4rem;
  letter-spacing: 6px;
  cursor: pointer;
  border-radius: 3px;
  transition: all 0.4s ease;
  text-shadow: 0 0 15px rgba(200,0,0,0.6);
  animation: pulse 2s infinite;
  position: relative;
}
.start-btn:hover, .start-btn:active {
  background: #8b0000;
  color: #fff;
  box-shadow: 0 0 60px rgba(139,0,0,0.7), 0 0 100px rgba(139,0,0,0.3);
  border-color: #ff0000;
  transform: scale(1.05);
}

/* ============================================================
   ENDING SCREEN
   ============================================================ */
.ending-screen {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 150;
  background: radial-gradient(ellipse at center, #0a0a0a 0%, #000 100%);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: all 1s ease;
}
.ending-screen.active { opacity: 1; visibility: visible; pointer-events: all; }
.ending-screen__content {
  text-align: center; padding: 24px; max-width: 420px;
}
.ending-screen__title {
  font-family: var(--font-horror);
  font-size: 1.8rem; color: #4caf50;
  text-shadow: 0 0 30px rgba(76,175,80,0.6), 0 0 60px rgba(76,175,80,0.3);
  margin-bottom: 20px;
  letter-spacing: 4px;
  animation: flicker 4s infinite;
}
.ending-screen__msg {
  font-size: 0.95rem; color: #bbb;
  margin-bottom: 28px; line-height: 1.9;
}
.ending-screen__cta {
  display: block; width: 100%;
  padding: 14px 36px;
  background: #8b0000;
  border: none; color: #fff;
  font-family: var(--font-display); font-size: 1.1rem;
  letter-spacing: 3px; cursor: pointer;
  border-radius: 3px;
  transition: all 0.3s ease;
  margin-bottom: 12px;
  box-shadow: 0 0 20px rgba(139,0,0,0.3);
}
.ending-screen__cta:hover { background: #b30000; box-shadow: 0 0 40px rgba(139,0,0,0.5); }

/* ============================================================
   MUTE TOGGLE
   ============================================================ */
.mute-toggle {
  position: fixed; top: 16px; right: 16px; z-index: 300;
  width: 40px; height: 40px;
  background: rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 50%;
  color: var(--text-dim);
  font-size: 1.2rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s ease;
}
.mute-toggle:hover { border-color: var(--accent-blood); color: var(--accent-blood-bright); }

/* ============================================================
   PROGRESS DOTS
   ============================================================ */
.progress-dots {
  display: flex; justify-content: center; gap: 8px;
  padding: 10px 0; flex-shrink: 0;
}
.progress-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: rgba(139,0,0,0.2);
  transition: all 0.4s ease;
}
.progress-dot.visited {
  background: #b30000;
  box-shadow: 0 0 8px rgba(179,0,0,0.8), 0 0 16px rgba(139,0,0,0.4);
}

/* Replay stats */
.replay-stats {
  text-align: center; font-size: 0.7rem; color: var(--text-dim);
  padding: 4px 0; flex-shrink: 0;
  letter-spacing: 0.5px;
  opacity: 0.8;
  cursor: pointer;
}
.replay-stats:hover { color: var(--accent-blood-bright); }

/* Zombie Collection Modal */
.zombie-modal {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 400;
  background: rgba(0,0,0,0.9);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: all 0.3s ease;
}
.zombie-modal.active { opacity: 1; visibility: visible; pointer-events: all; }
.zombie-modal__panel {
  background: rgba(10,0,0,0.97);
  border: 1px solid var(--accent-blood);
  border-radius: 8px;
  width: 90%; max-width: 380px; max-height: 80vh;
  display: flex; flex-direction: column;
  box-shadow: 0 0 40px rgba(139,0,0,0.3);
}
.zombie-modal__header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 20px; border-bottom: 1px solid rgba(139,0,0,0.3);
}
.zombie-modal__title {
  font-family: var(--font-display); font-size: 1.1rem; color: var(--accent-blood-bright);
}
.zombie-modal__close {
  background: none; border: none; color: var(--text-dim); font-size: 1.3rem;
  cursor: pointer; padding: 4px 8px;
}
.zombie-modal__close:hover { color: var(--accent-blood-bright); }
.zombie-modal__count {
  padding: 8px 20px; font-size: 0.8rem; color: var(--text-dim);
  border-bottom: 1px solid rgba(139,0,0,0.15);
}
.zombie-modal__list {
  flex: 1; overflow-y: auto; padding: 8px 20px;
  display: flex; flex-direction: column; gap: 6px;
}
.zombie-modal__list::-webkit-scrollbar { width: 3px; }
.zombie-modal__list::-webkit-scrollbar-thumb { background: var(--accent-blood); border-radius: 3px; }
.zombie-modal__item {
  font-size: 0.85rem; color: var(--text-primary);
  padding: 6px 10px; background: rgba(139,0,0,0.1);
  border-radius: 4px; border-left: 2px solid var(--accent-blood);
}
.zombie-modal__empty {
  text-align: center; color: var(--text-dim); padding: 24px 0;
  font-size: 0.9rem;
}
.zombie-modal__footer {
  padding: 12px 20px; border-top: 1px solid rgba(139,0,0,0.3);
  text-align: center;
}
.zombie-modal__btn {
  background: var(--accent-blood); border: none; color: #fff;
  padding: 8px 24px; border-radius: 4px; cursor: pointer;
  font-family: var(--font-body); font-size: 0.85rem;
}

/* ============================================================
   ANIMATIONS
   ============================================================ */
@keyframes flicker {
  0%, 100% { opacity: 1; }
  3% { opacity: 0.7; }
  6% { opacity: 1; }
  9% { opacity: 0.8; }
  12% { opacity: 1; }
  50% { opacity: 0.9; }
  53% { opacity: 0.6; }
  56% { opacity: 1; }
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 10px rgba(139,0,0,0.3); }
  50% { box-shadow: 0 0 30px rgba(139,0,0,0.6); }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  10% { transform: translateX(-4px); }
  20% { transform: translateX(4px); }
  30% { transform: translateX(-4px); }
  40% { transform: translateX(4px); }
  50% { transform: translateX(-2px); }
  60% { transform: translateX(2px); }
  70% { transform: translateX(-1px); }
  80% { transform: translateX(1px); }
}
@keyframes bloodDrip {
  0% { opacity: 0; transform: translateY(-100%); }
  20% { opacity: 1; }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translateY(100vh); }
}
.shaking { animation: shake 0.5s ease; }

/* Blood drip overlay for game over */
.blood-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 99;
  pointer-events: none; opacity: 0;
  background: radial-gradient(ellipse at center, rgba(180,0,0,0.35) 0%, rgba(139,0,0,0.15) 40%, transparent 75%);
  transition: opacity 1.5s ease;
}
.blood-overlay.active { opacity: 1; }

/* Jumpscare overlay */
.jumpscare {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 90;
  pointer-events: none; opacity: 0;
  background-image: url('assets/images/jumpscare-zombie.png');
  background-size: cover; background-position: center; background-repeat: no-repeat;
  transition: opacity 0.03s ease;
}
.jumpscare.active {
  opacity: 1;
  animation: jumpscareFlash 0.5s ease-out forwards;
}

/* Red flash overlay for jumpscare */
.jumpscare-flash {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 89;
  pointer-events: none; opacity: 0;
  background: radial-gradient(circle, rgba(180,0,0,0.7) 0%, rgba(139,0,0,0.3) 50%, transparent 100%);
  transition: opacity 0.03s ease;
}
.jumpscare-flash.active {
  opacity: 1;
  animation: redFlash 0.5s ease-out forwards;
}

@keyframes jumpscareFlash {
  0% { opacity: 0; transform: scale(0.6); filter: brightness(1); }
  15% { opacity: 1; transform: scale(1.15); filter: brightness(1.8); }
  30% { opacity: 1; transform: scale(1.05); filter: brightness(1.3); }
  100% { opacity: 0; transform: scale(1); filter: brightness(1); }
}
@keyframes redFlash {
  0% { opacity: 0; }
  10% { opacity: 1; }
  40% { opacity: 0.8; }
  100% { opacity: 0; }
}
@keyframes screenShake {
  0%, 100% { transform: translate(0, 0); }
  10% { transform: translate(-8px, 4px); }
  20% { transform: translate(8px, -4px); }
  30% { transform: translate(-6px, -2px); }
  40% { transform: translate(6px, 2px); }
  50% { transform: translate(-4px, 0); }
  60% { transform: translate(4px, 0); }
  70% { transform: translate(-2px, 0); }
  80% { transform: translate(2px, 0); }

<script>
/* ============================================================
   SPOILER VARIATIONS — slight text variations per playthrough
   ============================================================ */
function vary(texts) {
  return texts[Math.floor(Math.random() * texts.length)];
}

/* ============================================================
   TEXT HIGHLIGHTER — color important keywords
   ============================================================ */
const HIGHLIGHT_MAP = {
  '군인': '<span class="hl-soldier">군인</span>',
  '좀비': '<span class="hl-zombie">좀비</span>',
  '탈출': '<span class="hl-escape">탈출</span>',
  '숲': '<span class="hl-forest">숲</span>',
  '기차': '<span class="hl-train">기차</span>',
  '구조대': '<span class="hl-rescue">구조대</span>',
  '안전': '<span class="hl-safe">안전</span>',
  '위험': '<span class="hl-danger">위험</span>',
  '비상': '<span class="hl-danger">비상</span>',
  '죽음': '<span class="hl-death">죽음</span>',
  '생존': '<span class="hl-safe">생존</span>',
  '에코랜드': '<span class="hl-brand">에코랜드</span>',
  '좀비트레인': '<span class="hl-brand">좀비트레인</span>'
};

function highlightText(text) {
  let result = text;
  for (const [key, replacement] of Object.entries(HIGHLIGHT_MAP)) {
    const regex = new RegExp(key, 'g');
    result = result.replace(regex, replacement);
  }
  return result;
}

/* ============================================================
   REPLAY TRACKING — achievements & collection
   ============================================================ */
function getReplayData() {
  try {
    return JSON.parse(localStorage.getItem('zombie_train_replay') || '{}');
  } catch(e) { return {}; }
}

function saveReplayData(data) {
  localStorage.setItem('zombie_train_replay', JSON.stringify(data));
}

function recordEndingReached() {
  const data = getReplayData();
  if (!data.endings) data.endings = [];
  const endingKey = 'escape';
  if (!data.endings.includes(endingKey)) {
    data.endings.push(endingKey);
  }
  data.totalPlays = (data.totalPlays || 0) + 1;
  saveReplayData(data);
  updateReplayStats();
}

function recordZombieDeath(zombieName) {
  const data = getReplayData();
  if (!data.zombies) data.zombies = [];
  if (!data.zombies.includes(zombieName)) {
    data.zombies.push(zombieName);
  }
  data.totalDeaths = (data.totalDeaths || 0) + 1;
  data.totalPlays = (data.totalPlays || 0) + 1;
  saveReplayData(data);
  updateReplayStats();
}

function updateReplayStats() {
  const data = getReplayData();
  const el = document.getElementById('replayStats');
  if (!el) return;
  const total = data.totalPlays || 0;
  const deaths = data.totalDeaths || 0;
  const endings = (data.endings || []).length;
  const zombies = (data.zombies || []).length;
  if (total > 0) {
    el.innerHTML = '🔄 ' + total + '회 도전 | 💀 ' + deaths + '회 사망 | ⭐ ' + endings + '회 탈출 | 🧟 ' + zombies + '종 좀비 수집';
    el.style.display = 'block';
    el.onclick = openZombieModal;
  }
}

/* ============================================================
   ZOMBIE COLLECTION MODAL
   ============================================================ */
function openZombieModal() {
  const data = getReplayData();
  const zombies = data.zombies || [];
  const list = document.getElementById('zombieModalList');
  const count = document.getElementById('zombieModalCount');
  const modal = document.getElementById('zombieModal');

  count.textContent = '총 ' + zombies.length + '종의 좀비를 만났습니다 (최대 10,000종)';

  if (zombies.length === 0) {
    list.innerHTML = '<div class="zombie-modal__empty">아직 만난 좀비가 없습니다.<br>게임오버 될 때마다 새로운 좀비가 추가됩니다!</div>';
  } else {
    list.innerHTML = zombies.map(function(z, i) {
      return '<div class="zombie-modal__item">#' + (i + 1) + ' 「' + z + '」</div>';
    }).join('');
  }

  modal.classList.add('active');
}

function closeZombieModal() {
  document.getElementById('zombieModal').classList.remove('active');
}

/* ============================================================
   BACKGROUND IMAGE SWITCHING
   ============================================================ */
let currentBg = null;
function switchBackground(bgId) {
  if (currentBg === bgId) return;
  // Deactivate current
  if (currentBg) {
    const prevEl = document.getElementById(currentBg);
    if (prevEl) prevEl.classList.remove('active');
  }
  // Activate new
  const newEl = document.getElementById(bgId);
  if (newEl) {
    newEl.classList.add('active');
    currentBg = bgId;
  }
}

/* ============================================================
   JUMPSCARE
   ============================================================ */
function triggerJumpscare(imagePath) {
  if (!jumpscareOverlay || !jumpscareFlash) return;

  // Set the jumpscare image dynamically
  jumpscareOverlay.style.backgroundImage = `url('${imagePath}')`;

  // Trigger red flash + screen shake + jumpscare image simultaneously
  jumpscareFlash.classList.add('active');
  jumpscareOverlay.classList.add('active');
  mainContainer.style.animation = 'screenShake 0.5s ease-out';

  // Clean up after animation completes
  setTimeout(() => {
    jumpscareFlash.classList.remove('active');
    jumpscareOverlay.classList.remove('active');
    mainContainer.style.animation = '';
  }, 500);
}

/* ============================================================
   PROGRESS DOTS
   ============================================================ */
function updateProgressDots() {
  const totalScenes = Object.keys(SCENES).length;
  const visitedCount = gameState.history.length;
  progressDots.innerHTML = '';
  for (let i = 0; i < Math.min(totalScenes, 20); i++) {
    const dot = document.createElement('span');
    dot.className = 'progress-dot';
    if (i < visitedCount) dot.classList.add('visited');
    progressDots.appendChild(dot);
  }
}

/* ============================================================
   TYPEWRITER EFFECT
   ============================================================ */
let typewriterTimer = null;
function typewriterEffect(text, callback) {
  if (typewriterTimer) clearTimeout(typewriterTimer);
  sceneText.innerHTML = '';
  sceneText.classList.remove('fading');

  const highlighted = highlightText(text);
  const lines = highlighted.split('\n');
  let lineIndex = 0;
  let charIndex = 0;
  let html = '';

  function type() {
    if (lineIndex < lines.length) {
      if (charIndex < lines[lineIndex].length) {
        // Handle HTML tags — skip them as a whole
        if (lines[lineIndex][charIndex] === '<') {
          const endIdx = lines[lineIndex].indexOf('>', charIndex);
          if (endIdx !== -1) {
            html += lines[lineIndex].substring(charIndex, endIdx + 1);
            charIndex = endIdx + 1;
            typewriterTimer = setTimeout(type, 5);
            return;
          }
        }
        html += lines[lineIndex][charIndex];
        sceneText.innerHTML = html + '<span class="cursor"></span>';
        charIndex++;
        typewriterTimer = setTimeout(type, 25 + Math.random() * 20);
      } else {
        html += '<br>';
        lineIndex++;
        charIndex = 0;
        typewriterTimer = setTimeout(type, 80);
      }
    } else {
      sceneText.innerHTML = html;
      if (callback) callback();
    }
  }
  type();
}

/* ============================================================
   RENDER SCENE
   ============================================================ */
function renderScene(sceneId) {
  const scene = SCENES[sceneId];
  if (!scene) return;

  gameState.currentScene = sceneId;
  gameState.history.push(sceneId);
  updateProgressDots();

  // Switch background
  switchBackground(scene.bg);

  // Clear choices
  choicesArea.innerHTML = '';

  // Typewriter text
  typewriterEffect(scene.text, () => {
    // Render choices after text completes
    if (scene.choices && scene.choices.length > 0) {
      scene.choices.forEach((choice, index) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = choice.text;
        btn.style.animationDelay = `${index * 0.1}s`;
        btn.onclick = () => handleChoice(choice.next);
        choicesArea.appendChild(btn);
      });
    }

    // Trigger jumpscare for key zombie appearance scenes
    if (sceneId === 'askSoldier') {
      setTimeout(() => triggerJumpscare('assets/images/jumpscare-train.png'), 800);
    } else if (sceneId === 'deepForest') {
      setTimeout(() => triggerJumpscare('assets/images/jumpscare-forest.png'), 1000);
    } else if (sceneId === 'finalCrisis') {
      setTimeout(() => triggerJumpscare('assets/images/jumpscare-final.png'), 600);
    }

    // Handle game over
    if (scene.isGameOver) {
      setTimeout(() => showGameOver(scene.gameOverMsg), 1200);
    }

    // Handle ending
    if (scene.isEnding) {
      setTimeout(() => showEnding(scene.endingTitle, scene.endingMsg), 1500);
    }
  });
}

function handleChoice(nextSceneId) {
  // Disable all choice buttons
  document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);

  // Fade out text
  sceneText.classList.add('fading');

  setTimeout(() => {
    renderScene(nextSceneId);
  }, 400);
}

function generateZombieName() {
  const a = ZOMBIE_A[Math.floor(Math.random() * ZOMBIE_A.length)];
  const b = ZOMBIE_B[Math.floor(Math.random() * ZOMBIE_B.length)];
  return a + ' ' + b;

/* ============================================================
   GAME OVER
   ============================================================ */
function showGameOver(msg) {
  const zombieName = generateZombieName();
  gameoverMsg.textContent = msg;
  gameoverZombieName.textContent = '당신은 「' + zombieName + '」 좀비가 되었습니다.';
  gameoverOverlay.classList.add('active');
  bloodOverlay.classList.add('active');
  mainContainer.classList.add('shaking');

  recordZombieDeath(zombieName);

  // Check if already shared this session
  if (gameState.hasSharedThisSession || gameState.shareCount > 0) {
    retryBtn.disabled = false;
  }

  setTimeout(() => {
    mainContainer.classList.remove('shaking');
  }, 500);
}

function hideGameOver() {
  gameoverOverlay.classList.remove('active');
  bloodOverlay.classList.remove('active');
  gameoverZombieName.textContent = '';
}

/* ============================================================
   ENDING
   ============================================================ */
function showEnding(title, msg) {
  endingTitle.textContent = title;
  endingMsg.textContent = msg;
  endingScreen.classList.add('active');
  recordEndingReached();
}

function hideEnding() {
  endingScreen.classList.remove('active');
}

/* ============================================================
   SNS SHARING
   ============================================================ */
const SHARE_CONFIG = {
  title: '좀비트레인 — 에코랜드 테마파크',
  text: '에코랜드 테마파크의 좀비트레인에서 탈출했다! 당신의 선택은? 🧟🚂',
  url: window.location.href,
  hashtags: ['좀비트레인', '에코랜드테마파크', '호러체험', '텍스트어드벤처']
};

function markShared() {
  gameState.hasSharedThisSession = true;
  gameState.shareCount++;
  localStorage.setItem('zombie_train_shares', gameState.shareCount.toString());
  retryBtn.disabled = false;
}

// Web Share API (mobile native)
async function shareNative() {
  try {
    if (navigator.share) {
      await navigator.share({
        title: SHARE_CONFIG.title,
        text: SHARE_CONFIG.text,
        url: SHARE_CONFIG.url
      });
      markShared();
    } else {
      // Fallback: copy to clipboard
      await navigator.clipboard.writeText(
        `${SHARE_CONFIG.title}\n${SHARE_CONFIG.text}\n${SHARE_CONFIG.url}`
      );
      alert('링크가 클립보드에 복사되었습니다! 친구에게 공유해주세요.');
      markShared();
    }
  } catch(e) {
    // User cancelled share
    console.log('Share cancelled:', e);
  }
}

// KakaoTalk
function shareKakao() {
  // Check if Kakao SDK is loaded
  if (typeof Kakao !== 'undefined' && Kakao.isInitialized()) {
    Kakao.Share.sendDefault({
      objectType: 'feed',
      content: {
        title: SHARE_CONFIG.title,
        description: SHARE_CONFIG.text,
        imageUrl: 'https://images.unsplash.com/photo-1509248961158-e54f6934749c?w=400&q=60',
        link: { webUrl: SHARE_CONFIG.url, mobileWebUrl: SHARE_CONFIG.url }
      },
      buttons: [{ title: '좀비트레인 체험하기', link: { webUrl: SHARE_CONFIG.url, mobileWebUrl: SHARE_CONFIG.url } }]
    });
    markShared();
  } else {
    // Fallback: copy + open KakaoTalk
    copyAndOpen('카카오톡');
  }
}

// Facebook
function shareFacebook() {
  const fbUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(SHARE_CONFIG.url)}&quote=${encodeURIComponent(SHARE_CONFIG.text)}`;
  window.open(fbUrl, '_blank', 'width=600,height=400');
  markShared();
}

// Instagram (copy link + guide)
async function shareInstagram() {
  try {
    await navigator.clipboard.writeText(
      `${SHARE_CONFIG.title}\n${SHARE_CONFIG.text}\n${SHARE_CONFIG.url}`
    );
    alert('링크가 클립보드에 복사되었습니다!\n인스타그램 스토리에 붙여넣기 해주세요.');
    markShared();
  } catch(e) {
    alert('공유에 실패했습니다. 다시 시도해주세요.');
  }
}

function copyAndOpen(platform) {
  navigator.clipboard.writeText(
    `${SHARE_CONFIG.title}\n${SHARE_CONFIG.text}\n${SHARE_CONFIG.url}`
  ).then(() => {
    alert(`링크가 클립보드에 복사되었습니다!\n${platform}에 붙여넣기 해주세요.`);
    markShared();
  }).catch(() => {
    alert('공유에 실패했습니다. 다시 시도해주세요.');
  });
}

/* ============================================================
   RETRY / RESTART
   ============================================================ */
function retryGame() {
  hideGameOver();
  gameState.history = [];
  gameState.currentScene = null;
  updateProgressDots();
  renderScene('start');
}

function restartGame() {
  hideEnding();
  hideGameOver();
  gameState.history = [];
  gameState.currentScene = null;
  gameState.hasSharedThisSession = false;
  updateProgressDots();
  renderScene('start');
}

function shareAndRestart() {
  shareNative().then(() => {
    setTimeout(() => {
      hideEnding();
      gameState.history = [];
      gameState.currentScene = null;
      updateProgressDots();
      renderScene('start');
    }, 500);
  });
}

/* ============================================================
   START GAME
   ============================================================ */
function startGame() {
  startScreen.classList.add('hidden');
  updateReplayStats();
  // Try to play BGM on user interaction
  if (bgmAudio && !gameState.isMuted) {
    bgmAudio.play().catch(() => {});
  }
  renderScene('start');
}
